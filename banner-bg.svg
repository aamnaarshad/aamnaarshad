<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98cf0"/>
      <stop offset="0.5" stop-color="#e49ad6"/>
      <stop offset="1" stop-color="#ff8fb5"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="round"><rect width="1200" height="200" rx="22"/></clipPath>
    <path id="star" d="M0,-10 Q1.2,-1.2 10,0 Q1.2,1.2 0,10 Q-1.2,1.2 -10,0 Q-1.2,-1.2 0,-10Z" fill="#fff"/>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .d1{animation-delay:.4s}.d2{animation-delay:1.1s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}
      @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="200" fill="url(#sky)"/>
    <g filter="url(#blur)" fill="#fff">
      <ellipse cx="90" cy="190" rx="190" ry="40" opacity=".35"/>
      <ellipse cx="360" cy="215" rx="230" ry="45" opacity=".28"/>
      <ellipse cx="760" cy="210" rx="260" ry="40" opacity=".25"/>
      <ellipse cx="1110" cy="180" rx="200" ry="50" opacity=".38"/>
      <ellipse cx="620" cy="10" rx="260" ry="30" opacity=".22"/>
    </g>
    <use href="#star" class="tw" transform="translate(70,45) scale(1.5)"/>
    <use href="#star" class="tw d1" transform="translate(230,140) scale(.9)"/>
    <use href="#star" class="tw d2" transform="translate(360,40) scale(1.1)"/>
    <use href="#star" class="tw d3" transform="translate(520,150) scale(1.2)"/>
    <use href="#star" class="tw d4" transform="translate(640,55) scale(.8)"/>
    <use href="#star" class="tw d1" transform="translate(830,35) scale(1.6)"/>
    <use href="#star" class="tw d2" transform="translate(960,150) scale(1)"/>
    <use href="#star" class="tw d3" transform="translate(1090,60) scale(1.4)"/>
    <use href="#star" class="tw d4" transform="translate(1150,150) scale(.8)"/>
    <use href="#star" class="tw" transform="translate(160,95) scale(.7)"/>
    <use href="#star" class="tw d2" transform="translate(740,120) scale(.7)"/>
    <circle class="tw d1" cx="290" cy="90" r="2" fill="#fff"/>
    <circle class="tw d3" cx="440" cy="100" r="1.8" fill="#fff"/>
    <circle class="tw d2" cx="900" cy="90" r="2" fill="#fff"/>
    <circle class="tw" cx="1030" cy="115" r="1.8" fill="#fff"/>
    <circle class="tw d4" cx="30" cy="150" r="1.8" fill="#fff"/>
  </g>
</svg>
